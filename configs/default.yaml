app:
  name: aipulse
  timezone: Asia/Shanghai          # 存储统一 UTC，展示用此
  data_dir: data
  log_level: ${AIPULSE_LOG_LEVEL:-INFO}

# v1.3：运行模式。off=零 API 花费；hybrid=仅预言+点评；full=全部
# 未配置 api_key（或 base_url）时自动降级为 off，不报错退出
# ★ 必须写成占位符：`load_settings` 用 `Settings(**yaml)` 构造，init kwargs 优先级高于
#   环境变量，写成字面量会让 `AIPULSE_MODE`（daily.yml 声明的 hybrid）被静默无视。
mode: ${AIPULSE_MODE:-full}

llm:
  enabled: ${AIPULSE_LLM__ENABLED:-true}   # mode 为 off 时强制 false
  provider: openai_compat
  base_url: ${AIPULSE_LLM__BASE_URL}
  api_key: ${AIPULSE_LLM__API_KEY}
  # 厂商/模型名随 base_url 一起变，光换 base_url 换不动模型（换厂商的真实操作）
  fast_model: ${AIPULSE_LLM__FAST_MODEL:-deepseek-chat}
  strong_model: ${AIPULSE_LLM__STRONG_MODEL:-deepseek-reasoner}
  temperature: 0.4
  # 读超时：strong 档走思维链，比 fast 慢得多，故分开设（见 config.py 的注释）
  timeout_s: ${AIPULSE_LLM__TIMEOUT_S:-120}
  timeout_strong_s: ${AIPULSE_LLM__TIMEOUT_STRONG_S:-180}
  max_retries: 3
  cache_enabled: true
  json_schema: auto                # auto=运行时自动降级；true/false=强制指定（§8.3）

budget:
  daily_limit_cny: ${AIPULSE_BUDGET__DAILY_LIMIT_CNY:-2.0}
  degrade_order: [debate, trend, brief_topn, all]
  price_fast_cny_per_1m: 1.0       # 成本估算单价（元/百万 token），可调
  price_strong_cny_per_1m: 4.0

pipeline:
  daily_top_n: 30
  brief_sections: [开源项目, 论文与研究, 社区舆论, 产业与新闻]
  predictions_per_day: 5
  prediction_horizons: [7, 30, 90]
  auto_verify: true
  weekly_debate_enabled: true

# 到期验证（M3b，设计方案 §10.2.2 / §10.2.3 v1.9）
verify:
  grace_days: 7                    # 证据不足时的重试窗口（due_date 后再等 N 天）
  evidence_window_grace_days: 3    # 检索窗口右界宽限：[生成日, due_date + N]
  evidence_top_k: 20               # 证据截断条数
  similarity_threshold: 0.15       # TF-IDF 余弦下限（进候选池）
  strong_similarity: 0.30          # 单条强证据阈值
  min_evidence: 3                  # 证据充分度下限（少于 3 条且无强证据 → 不调 LLM）
  partial_tolerance: 0.05          # 阈值型判据的 partial 容差带
  max_context_tokens: 12000        # 证据注入 LLM 的 token 预算

# 指标增速（M4）：两次快照间隔 < 该值时不计算增速（标 insufficient），
# 避免调试连跑时把"几分钟涨 3 star"误报成"日增 3000"
signals:
  min_velocity_window_hours: 6.0

output:
  formats: [md, json]
  html_enabled: true
  dir: data/reports

notify:
  channels: [file]        # v1.2 只有 file；预留 email/telegram/feishu/desktop（暂不实现）

http:
  timeout_connect_s: 5
  timeout_read_s: 20
  max_concurrency: 6
  cache_enabled: true
  cache_ttl_s: 1800
  cache_dir: data/cache
  user_agent: "aipulse/0.1 (+https://github.com/tochikoma777/aipulse)"
  max_retries: 3
