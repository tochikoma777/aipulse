[project]
name = "aipulse"
version = "0.1.0"
description = "AI 脉搏：每日自动采集 AI 领域热点，不只整理，还给出可回测的推演与预言"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aipulse contributors" }]
keywords = ["ai", "llm", "newsletter", "prediction", "rss", "arxiv"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "feedparser>=6.0.11",
    "tenacity>=8.3",
    "jinja2>=3.1",
    "structlog>=24.1",
    "jieba>=0.42.1",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
aipulse = "aipulse.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", "data", "src/aipulse/store/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 脚本与测试允许 print（脚本要向终端打印探测结果）与直接 import
"scripts/*" = ["T201"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = []
exclude = ["src/aipulse/store/migrations/", "build/"]

[[tool.mypy.overrides]]
# CLI 与采集器骨架存在 NotImplementedError 占位，暂不要求完整类型
module = ["aipulse.cli.*", "aipulse.collectors.*", "aipulse.pipeline.*", "aipulse.web.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["feedparser.*", "jieba.*", "sklearn.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/aipulse"]
omit = ["*/migrations/*"]
